volumes:
  worker_state:

services:
  worker:
    build: ./worker
    restart: unless-stopped
    env_file: .env
    ports:
      - "${WORKER_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - worker_state:/app/state
    extra_hosts:
      - "host.docker.internal:host-gateway"
